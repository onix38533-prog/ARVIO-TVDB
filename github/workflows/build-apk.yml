steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up JDK 11
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '11'

  - name: Make Gradle wrapper executable
    run: chmod +x ./gradlew

  - name: Cache Gradle packages
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      restore-keys: |
        gradle-${{ runner.os }}-

  - name: Install Android SDK command-line tools
    run: |
      sudo apt-get update
      sudo apt-get install -y wget tar unzip
      mkdir -p $HOME/Android/Sdk/cmdline-tools
      wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
      unzip /tmp/cmdline.zip -d /tmp/cmdline
      mkdir -p $HOME/Android/Sdk/cmdline-tools/latest
      mv /tmp/cmdline/cmdline-tools/* $HOME/Android/Sdk/cmdline-tools/latest/
      export ANDROID_SDK_ROOT=$HOME/Android/Sdk
      yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

  - name: Accept Android SDK licenses
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/sdk
    run: |
      export ANDROID_SDK_ROOT=$HOME/Android/Sdk
      yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

  - name: Build debug APK
    env:
      ANDROID_SDK_ROOT: $HOME/Android/Sdk
    run: ./gradlew assembleDebug --no-daemon --stacktrace

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-debug-apk
      path: app/build/outputs/apk/debug/*.apk
